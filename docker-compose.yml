# ================================================================
#  IoT 智慧手錶監控系統 - Docker Compose
#  架構：Kafka (KRaft) + PostgreSQL + Monitoring Stack
#
#  作者備註：
#  - 使用 KRaft Mode，無需 ZooKeeper，節省約 300MB RAM
#  - 針對 macOS (Docker Desktop) 優化記憶體限制
#  - 所有 image 均鎖定版本，避免 latest 帶來的相容性問題
#
#  啟動前準備：
#  1. 執行 setup.sh 建立設定檔目錄與檔案
#  2. 執行以下指令生成 KRaft Cluster ID，並更新 .env：
#     docker run --rm confluentinc/cp-kafka:7.6.0 kafka-storage random-uuid
#  3. Docker Desktop → Settings → Resources → Memory → 至少 6GB
#
#  啟動指令（建議分批啟動）：
#  docker compose up -d postgres
#  docker compose up -d kafka-1 kafka-2 kafka-3
#  docker compose up -d kafka-exporter node-exporter postgres-exporter
#  docker compose up -d prometheus
#  docker compose up -d grafana
# ================================================================

# ================================================================
#  YAML Anchors - Kafka 共用設定
#  Image: confluentinc/cp-kafka:7.6.0
#  (Confluent Platform 7.6.0 對應 Apache Kafka 3.6.x)
# ================================================================
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.0
  networks:
    - data_network
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 850m
        cpus: '0.5'
      reservations:
        memory: 512m
  healthcheck:
    # 使用單行指令，避免 YAML block scalar 在不同 Docker Engine 版本的解析差異
    test:
      - "CMD-SHELL"
      - "kafka-topics --bootstrap-server localhost:29092 --list > /dev/null 2>&1"
    interval: 30s
    timeout: 15s
    retries: 5
    start_period: 90s

# ================================================================
#  Networks
# ================================================================
networks:
  data_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

# ================================================================
#  Volumes
# ================================================================
volumes:
  postgres_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  prometheus_data:
  grafana_data:

# ================================================================
#  Services
# ================================================================
services:

  # ==============================================================
  #  SECTION 1 — PostgreSQL
  # ==============================================================
  postgres:
    image: postgres:15.5-alpine
    container_name: postgres_db
    hostname: postgres
    networks:
      - data_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sports_iot}
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-sports_iot}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==============================================================
  #  SECTION 2 — Kafka Cluster（KRaft Mode，3 Brokers）
  #
  #  架構說明：
  #  - KRaft Mode：Kafka 3.x 原生 Raft 共識，不需要 ZooKeeper
  #  - 三個 Broker 同時兼任 Controller 角色（process_roles=broker,controller）
  #  - Leader 選舉需要 quorum（至少 2/3 節點同意）
  #
  #  Listener 設計（三層隔離）：
  #  ┌──────────────┬─────────┬────────────────────────────────┐
  #  │ Listener     │ Port    │ 用途                            │
  #  ├──────────────┼─────────┼────────────────────────────────┤
  #  │ PLAINTEXT    │ 29092   │ 容器間通訊（Broker 互相溝通）      │
  #  │ CONTROLLER   │ 29093   │ KRaft 選舉（不對外暴露）          │
  #  │ EXTERNAL     │ 909x    │ 宿主機 Python 腳本連線           │
  #  └──────────────┴─────────┴────────────────────────────────┘
  #
  #  高可用設定：
  #  - replication.factor=3：每筆資料在三個 broker 都有副本
  #  - min.insync.replicas=2：至少 2 個副本確認才算寫入成功
  #  → 可以容忍 1 個 broker 掛掉，服務不中斷
  #
  #  ⚠️  Cluster ID 注意事項：
  #  - 必須由官方工具生成：
  #    docker run --rm confluentinc/cp-kafka:7.6.0 kafka-storage random-uuid
  #  - 三個 broker 必須使用完全相同的 Cluster ID
  #  - 一旦 Volume 已格式化，變更 ID 必須先 docker compose down -v
  # ==============================================================
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      # ── KRaft 身份設定 ──────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # ── Cluster ID ──────────────────────────────────────────
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      # ── Controller Quorum ───────────────────────────────────
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"

      # ── Listeners 設定 ──────────────────────────────────────
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ── 儲存設定 ────────────────────────────────────────────
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # ── 複製與高可用 ─────────────────────────────────────────
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # ✅ 修正：明確設定內部 topic 的 replication factor
      # 否則 __consumer_offsets 預設只有 1 個副本
      # 異常模擬時 broker 掛掉會導致 Consumer Lag 資訊消失
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # ── 資料保留 ────────────────────────────────────────────
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # ── JVM 設定 ────────────────────────────────────────────
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_3_data:/var/lib/kafka/data

  # ==============================================================
  #  SECTION 3 — Monitoring Stack
  #
  #  監控架構：
  #  kafka-exporter  ─┐
  #  node-exporter   ─┼─► Prometheus (TSDB) ─► Grafana (視覺化)
  #  postgres-exporter┘
  # ==============================================================

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    networks:
      - data_network
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka-1:29092"
      - "--kafka.server=kafka-2:29092"
      - "--kafka.server=kafka-3:29092"
      - "--topic.filter=.*"
      - "--group.filter=.*"
      # ✅ 修正：移除不存在的 --retry.backoff flag
      # 靠 restart: unless-stopped 自動處理 KRaft 選舉期間的短暫不可用
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.2'
    # ✅ 新增 healthcheck，讓 prometheus 的 depends_on 可以用 service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9308/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    hostname: node-exporter
    networks:
      - data_network
    ports:
      - "9100:9100"
    command:
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.diskstats"
      - "--collector.netdev"
      - "--collector.filefd"
      # ✅ 新增：filesystem collector，Grafana 磁碟使用率面板需要
      # 排除 /sys /proc /dev 等虛擬 filesystem，避免雜訊
      - "--collector.filesystem"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.1'

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    hostname: postgres-exporter
    networks:
      - data_network
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-sports_iot}?sslmode=disable"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.2'
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    hostname: prometheus
    networks:
      - data_network
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    depends_on:
      # ✅ 升級為 service_healthy（kafka-exporter 現在有 healthcheck 了）
      kafka-exporter:
        condition: service_healthy
      node-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    hostname: grafana
    networks:
      - data_network
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GF_METRICS_ENABLED: "true"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.3'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    ports:
      - "9098:9093"
    networks:
      - data_network
    restart: unless-stopped
