# ================================================================
#  Grafana Datasource 自動化設定
#  Grafana 啟動時自動載入，不需要手動在 UI 設定
# ================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy              # Grafana 容器代為訪問 Prometheus（不是瀏覽器直連）
    url: http://prometheus:9090
    isDefault: true            # 設為預設 datasource
    editable: false            # 防止在 UI 誤改設定
