# ================================================================
#  Prometheus 抓取設定
#  scrape_interval：每 15 秒向各 exporter 拉一次 metrics
# ================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus 監控自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kafka 指標（Consumer Lag、Topic 吞吐量、Broker 狀態）
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # 系統指標（CPU、Memory、Disk）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL 指標（連線數、Query 效能）
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Grafana 自身監控（加分項：連監控工具本身都監控）
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

# Prometheus 設定（prometheus.yml）加入 AlertManager 連接

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093    # Docker 網路內部名稱

# 引入告警規則
rule_files:
  - /etc/prometheus/rules/*.yml